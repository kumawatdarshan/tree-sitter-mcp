[package]
name = "tree-sitter-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
rmcp = { version = "2.2.0", features = ["schemars"] }
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.19"
tracing = "0.1.44"
tree-sitter = "0.26.11"
tree-sitter-loader = "0.26.11"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
etcetera = "0.11.0"
toml = "1.1.3"
globset = "0.4.19"
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
