[workspace.metadata.crane]
name = "Tree-Sitter MCP Server"
version = "0.0.1"

[workspace.package]
version = "0.0.1"
authors = ["Darshan Kumawat <mail@darshan.qzz.io>"]
edition = "2024"
categories = ["mcp", "tree-sitter"]

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
anyhow = "1.0.104"
rmcp = { version = "2.2.0", features = ["schemars"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.53.1", features = ["full"] }
tempfile = "3"
tree-sitter-rust = "0.23"

### Local Crates

config = { path = "crates/config" }
grammar = { path = "crates/grammar" }
mcp = { path = "crates/mcp" }
